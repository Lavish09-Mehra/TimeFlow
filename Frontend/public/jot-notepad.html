<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3eee4; --dot:#d8cfbe; --ink:#20232b; --mut:#6d7280; --chrome:#fffdf8; --line:#e3dac8; --ac:#ff5a36; --hand:"Caveat","Segoe Print","Bradley Hand",cursive; }
  [data-theme=dark] { --bg:#14151a; --dot:#262832; --ink:#f1f2f6; --mut:#9a9fb0; --chrome:#1e2027; --line:#2c2f3a; }
  * { box-sizing:border-box; margin:0; }
  html, body { scrollbar-width:none; -ms-overflow-style:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar, .sheet::-webkit-scrollbar { width:0; height:0; display:none; }
  body { min-height:100vh; color:var(--ink); background:transparent; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  svg { display:block; flex:none; }
  .top { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px; padding:14px 28px; backdrop-filter:blur(10px); background:color-mix(in srgb,var(--bg) 78%,transparent); }
  .brand { display:flex; align-items:baseline; gap:12px; }
  h1 { font:700 46px/1 var(--hand); text-decoration:underline wavy var(--ac) 3px; text-underline-offset:7px; }
  #count { color:var(--mut); font-size:13px; }
  .search { margin-left:auto; display:flex; align-items:center; gap:8px; width:min(340px,100%); padding:0 14px; height:42px; border-radius:999px; background:var(--chrome); border:1px solid var(--line); color:var(--mut); transition:box-shadow .2s,border-color .2s; }
  .search:focus-within { border-color:var(--ac); box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent); }
  .search input { flex:1; min-width:0; border:0; outline:0; background:none; font:inherit; color:var(--ink); }
  .round { display:none; }
  .round:hover { }
  .top { display:none !important; }
  .dock { 
    position:fixed; 
    bottom:22px; 
    left:50%; 
    transform:translateX(-50%); 
    display:flex !important; 
    gap:4px; 
    padding:7px; 
    border-radius:999px; 
    background:#20232b; 
    border:1px solid rgba(255,255,255,.12); 
    box-shadow:0 20px 44px -10px rgba(0,0,0,.6); 
    z-index:10;
  }
  .card { cursor:grab; }
  .card:active { cursor:grabbing; }
  #grid { column-width:240px; column-gap:24px; max-width:1280px; margin:0 auto; padding:18px 28px 150px; }
  .card { position:relative; display:block; break-inside:avoid; margin:0 0 24px; padding:20px 18px 12px; border-radius:6px 6px 16px 6px; background:var(--c); color:#20232b; cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,.06),0 14px 26px -14px rgba(0,0,0,.45); transform:rotate(var(--r)); transition:transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .3s; }
  .card:hover { transform:rotate(0) translateY(-7px) scale(1.025); box-shadow:0 1px 0 rgba(0,0,0,.06),0 26px 40px -16px rgba(0,0,0,.5); }
  .card.pop { animation:pop .6s cubic-bezier(.2,1.3,.4,1) backwards; }
  @keyframes pop { from { opacity:0; transform:translateY(30px) rotate(calc(var(--r)*4)) scale(.9); } }
  .tape { position:absolute; top:-11px; left:50%; width:74px; height:22px; background:rgba(255,255,255,.6); transform:translateX(-50%) rotate(-2.5deg); clip-path:polygon(0 0,100% 0,97% 50%,100% 100%,0 100%,3% 50%); }
  .pinned { position:absolute; top:9px; right:11px; opacity:.7; }
  .card h3 { font:700 27px/1.05 var(--hand); margin-bottom:6px; overflow-wrap:anywhere; }
  .card p { white-space:pre-wrap; overflow-wrap:anywhere; color:rgba(32,35,43,.82); font-size:14.5px; }
  .cover { width:100%; max-height:210px; object-fit:cover; border-radius:8px; margin-bottom:10px; display:block; }
  .card ul { list-style:none; padding:0; margin-top:8px; }
  .card li { display:flex; align-items:center; gap:9px; padding:3px 0; font-size:14px; }
  .card li b { width:17px; height:17px; border:2px solid #20232b; border-radius:5px; display:grid; place-items:center; flex:none; transition:background .15s; }
  .card li.d { opacity:.55; text-decoration:line-through; }
  .card li.d b { background:#20232b; color:#fff; }
  .card small { opacity:.6; }
  .bar { height:5px; border-radius:3px; background:rgba(0,0,0,.12); margin-top:8px; overflow:hidden; }
  .bar u { display:block; height:100%; background:#20232b; border-radius:3px; transition:width .4s; }
  .card footer { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:12px; opacity:.6; }
  .card footer span { display:flex; gap:6px; align-items:center; }
  .card-body { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }
  .card-body.open { display:block; -webkit-line-clamp:unset; overflow:visible; }
  .readmore { display:inline; margin-top:6px; padding:0; border:0; background:none; color:var(--ac); font:inherit; font-weight:700; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  .readmore[hidden] { display:none; }
  .card.dark .readmore { color:#ff9a80; }
  .card.dark { color:#f4f5f8; }
  .card.dark p { color:rgba(244,245,248,.82); }
  .card.dark li b { border-color:#f4f5f8; }
  .card.dark li.d b { background:#f4f5f8; color:#20232b; }
  .card.dark .bar { background:rgba(255,255,255,.18); }
  .card.dark .bar u { background:#f4f5f8; }
  .card.dark .tape { background:rgba(255,255,255,.22); }
  .sheet.dark { color:#f4f5f8; }
  .sheet.dark .title, .sheet.dark #b, .sheet.dark .tr input { color:#f4f5f8; }
  .sheet.dark ::placeholder { color:rgba(244,245,248,.4); }
  .sheet.dark .sec { border-top-color:rgba(255,255,255,.18); }
  .sheet.dark .ib:hover { background:rgba(255,255,255,.12); }
  .sheet.dark .ib.act { background:#f4f5f8; color:#20232b; }
  .sheet.dark .add { background:rgba(255,255,255,.12); }
  .sheet.dark .add:hover { background:rgba(255,255,255,.2); }
  .sheet.dark .dot { border-color:rgba(255,255,255,.28); }
  .sheet.dark .dot.on { border-color:#f4f5f8; }
  .sheet.dark .ck { border-color:#f4f5f8; }
  .sheet.dark .tr.d .ck { background:#f4f5f8; color:#20232b; }
  .sheet.dark .tr input:focus { border-color:rgba(255,255,255,.35); }
  #empty { text-align:center; margin-top:12vh; font:700 36px var(--hand); color:var(--mut); }
  .dock { position:fixed; z-index:6; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:7px; border-radius:999px; background:#20232b; border:1px solid rgba(255,255,255,.12); box-shadow:0 20px 44px -10px rgba(0,0,0,.6); }
  .dock button { display:flex; align-items:center; gap:8px; padding:11px 18px; border-radius:999px; color:#fff; font-weight:600; transition:background .2s,transform .2s; }
  .dock button:hover { background:rgba(255,255,255,.14); transform:translateY(-2px); }
  .dock .pri { background:var(--ac); }
  .dock .pri:hover { background:#ff6f4f; }
  .veil { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:16px; background:rgba(16,17,22,.5); backdrop-filter:blur(8px); opacity:0; visibility:hidden; transition:opacity .25s,visibility 0s .25s; }
  .veil.on { opacity:1; visibility:visible; transition-delay:0s; }
  .sheet { position:relative; width:min(680px,100%); max-height:92vh; overflow:auto; padding:18px 24px 24px; border-radius:22px; background:var(--c); color:#20232b; box-shadow:0 40px 80px -20px rgba(0,0,0,.6); transform:translateY(20px) scale(.96); transition:transform .35s cubic-bezier(.2,1.3,.4,1),background .25s; }
  .veil.on .sheet { transform:none; }
  .sheet.drag { outline:3px dashed #20232b; outline-offset:-10px; }
  .eh { display:flex; align-items:center; gap:4px; }
  .dots { display:flex; gap:8px; }
  .dot { width:22px; height:22px; border-radius:50%; border:2px solid rgba(0,0,0,.18); transition:transform .2s; }
  .dot.on { border-color:#20232b; transform:scale(1.2); }
  .sp { flex:1; }
  .ib { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; transition:background .15s; }
  .ib:hover { background:rgba(0,0,0,.09); }
  .ib.act { background:#20232b; color:#fff; }
  .ib.sm { width:28px; height:28px; border-radius:8px; }
  .title { display:block; width:100%; margin-top:8px; border:0; outline:0; background:none; color:inherit; font:700 40px/1.1 var(--hand); }
  #b { display:block; width:100%; min-height:110px; border:0; outline:0; resize:none; background:none; color:inherit; font:16px/1.6 system-ui,sans-serif; }
  ::placeholder { color:rgba(32,35,43,.35); }
  .sec { margin-top:16px; padding-top:12px; border-top:2px dashed rgba(0,0,0,.15); }
  .sh { font-weight:700; font-size:13px; opacity:.65; margin-bottom:6px; }
  .tr { display:flex; align-items:center; gap:8px; padding:2px 0; }
  .ck { width:22px; height:22px; border:2px solid #20232b; border-radius:7px; display:grid; place-items:center; flex:none; transition:background .15s; }
  .tr.d .ck { background:#20232b; color:#fff; }
  .tr input { flex:1; min-width:0; border:0; outline:0; background:none; font:15px system-ui,sans-serif; color:inherit; padding:5px 0; border-bottom:1px dashed transparent; }
  .tr input:focus { border-color:rgba(0,0,0,.3); }
  .tr.d input { text-decoration:line-through; opacity:.5; }
  .add { margin-top:8px; padding:8px 13px; border-radius:10px; background:rgba(0,0,0,.07); font-weight:600; font-size:13px; transition:background .15s; }
  .add:hover { background:rgba(0,0,0,.13); }
  .imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .imgs div { position:relative; }
  .imgs img { width:100%; height:96px; object-fit:cover; border-radius:10px; display:block; }
  .imgs .ib { position:absolute; top:4px; right:4px; background:rgba(0,0,0,.55); color:#fff; }
  #sk img { width:100%; border-radius:12px; border:2px solid rgba(0,0,0,.1); cursor:pointer; display:block; }
  .draw { position:fixed; inset:0; z-index:40; background-color:#fffdf8; background-image:radial-gradient(#d9d2c3 1.3px,transparent 1.6px); background-size:24px 24px; color:#20232b; opacity:0; visibility:hidden; transition:opacity .25s,visibility 0s .25s; }
  .draw.on { opacity:1; visibility:visible; transition-delay:0s; }
  #cv { display:block; touch-action:none; cursor:crosshair; }
  #tb { position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px; max-width:calc(100vw - 16px); padding:6px 8px; border-radius:16px; background:#fff; border:1px solid #e6e0d2; box-shadow:0 14px 34px -10px rgba(0,0,0,.3); }
  .tb { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; transition:background .15s; }
  .tb:hover { background:#f2eee5; }
  .tb.on { background:#ffe3dc; color:#d63a1a; }
  .tb b { display:block; border-radius:50%; background:currentColor; }
  .sw { width:24px; height:24px; margin:0 3px; border-radius:50%; background:var(--s); transition:transform .15s; }
  .sw:hover { transform:scale(1.15); }
  .sw.on { box-shadow:0 0 0 2px #fff,0 0 0 4px var(--s); }
  .vr { width:1px; height:24px; background:#e6e0d2; margin:0 5px; }
  .txt { height:38px; padding:0 14px; border-radius:10px; font-weight:600; }
  .txt:hover { background:#f2eee5; }
  .txt.go { background:var(--ac); color:#fff; }
  .txt.go:hover { background:#ff6f4f; }
  #toast { position:fixed; z-index:60; bottom:100px; left:50%; transform:translate(-50%,16px); display:flex; align-items:center; gap:14px; padding:11px 16px; border-radius:12px; background:#20232b; color:#fff; box-shadow:0 14px 30px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .25s,transform .25s; }
  #toast.on { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #toast button { color:#ff9a80; font-weight:700; }
  @media (max-width:560px) { .top { padding:10px 14px; flex-wrap:wrap; } .search { order:3; width:100%; } .brand { flex:1; } #grid { column-width:150px; column-gap:16px; padding:12px 14px 140px; } .dock button span { display:none; } .dock button { padding:12px 16px; } .sheet { padding:16px; } .title { font-size:34px; } }
  @media (prefers-reduced-motion:reduce) { *, *::before { animation:none !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1></h1><span id="count"></span></div>
  <label class="search"><span data-ic="search" data-s="18"></span><input id="q" placeholder="Search notes   ( / )" autocomplete="off"></label>
  <button class="round" id="theme" title="Toggle theme" data-ic="moon"></button>
</header>
<main>
  <section id="grid" aria-label="Notes"></section>
  <p id="empty" hidden>Nothing here yet. Start jotting!</p>
</main>
<nav class="dock">
  <button class="pri" data-new="note" data-ic="plus"><span>Note</span></button>
  <button data-new="todo" data-ic="list"><span>Checklist</span></button>
  <button data-new="draw" data-ic="pen"><span>Sketch</span></button>
</nav>
<div class="veil" id="ed"><div class="sheet" id="sheet"><div class="eh"><div class="dots" id="dots"></div><span class="sp"></span><button class="ib" id="pin" title="Pin" data-ic="pin"></button><button class="ib" id="del" title="Delete" data-ic="trash"></button><button class="ib" id="close" title="Close (Esc)" data-ic="x"></button></div><input class="title" id="t" placeholder="Title" autocomplete="off"><textarea id="b" placeholder="Start typing, or paste / drop an image…"></textarea><div class="sec"><div class="sh">Checklist<span id="prog"></span></div><div id="todos"></div><button class="add" id="addt">+ Add item</button></div><div class="sec"><div class="sh">Images</div><div class="imgs" id="imgs"></div><button class="add" id="addi">+ Attach image</button></div><div class="sec"><div class="sh">Sketch</div><div id="sk"></div><button class="add" id="draw">+ Open canvas</button></div></div></div>
<div class="draw" id="dr"><canvas id="cv"></canvas><div id="tb"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script>
(() => { const $ = s => document.querySelector(s); const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); const IC = { hand: "M8 13V5a2 2 0 0 1 4 0v6M12 11V4a2 2 0 0 1 4 0v7M16 11V6a2 2 0 0 1 4 0v8a7 7 0 0 1-7 7h-2a7 7 0 0 1-6-4l-2-4a2 2 0 0 1 3-3l3 3", select: "M4 4h4M12 4h4M20 4v4M20 12v4M20 20h-4M12 20H8M4 20v-4M4 12V8", pen: "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z", line: "M5 19 19 5", arrow: "M5 19 19 5M9 5h10v10", rect: "M4 6h16v12H4Z", ellipse: "M3 12a9 6 0 1 0 18 0 9 6 0 1 0-18 0", eraser: "M7 21h13M5 13l8-8a2 2 0 0 1 3 0l3 3a2 2 0 0 1 0 3l-8 8H8l-3-3a2 2 0 0 1 0-3Z", undo: "M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3", redo: "m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3", trash: "M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3", image: "M4 5h16v14H4ZM4 16l5-5 4 4 3-3 4 4M9 9h.01", check: "m4 12 5 5L20 6", pin: "M12 17v5M8 3h8l-1 6 3 3H6l3-3Z", plus: "M12 5v14M5 12h14", x: "M6 6l12 12M18 6 6 18", moon: "M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10Z", search: "M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14ZM21 21l-5-5", list: "M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2" }; const ic = (n, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n]}"/></svg>`; document.querySelectorAll("[data-ic]").forEach(b => b.insertAdjacentHTML("afterbegin", ic(b.dataset.ic, +b.dataset.s || 20))); const COL = ["#ffe066", "#8fe3b5", "#ff9f8f", "#8ecbff", "#c9b3ff", "#fff6e5", "#20232b"]; const PAL = ["#20232b", "#e03131", "#f08c00", "#2f9e44", "#1971c2", "#9c36b5"], WS = [2.5, 4.5, 8]; const uid = () => Math.random().toString(36).slice(2, 9); const ago = t => { const s = (Date.now() - t) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + "m ago" : s < 86400 ? Math.floor(s / 3600) + "h ago" : new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short" });
